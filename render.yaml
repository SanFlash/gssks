services:
  - type: web
    name: gyanpath-ngo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/render_start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gyanpath-db
          property: connectionString
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: DONATIONS_ENABLED
        value: 'false'
databases:
  - name: gyanpath-db
    plan: free
    databaseName: gyanpath
    user: gyanpath
