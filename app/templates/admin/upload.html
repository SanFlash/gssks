{% extends 'admin/base.html' %}{% block content %}<div class="admin-content narrow"><h1>{{ title }}</h1>{% if not configured %}<div class="notice">Cloudinary is not configured. Add CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET to your environment.</div>{% endif %}<form method="post" enctype="multipart/form-data" class="panel"><input name="csrf_token" type="hidden" value="{{ csrf_token() }}"><label class="drop-zone" for="file"><strong>Choose a file or drop it here</strong><span>Images up to 10 MB · PDF up to 5 MB · Video up to 25 MB</span><input name="file" id="file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,application/pdf" required></label>{% if not replacing %}<div class="field"><label for="kind">Media type</label><select name="kind" id="kind"><option value="image">Image</option><option value="video">Video</option><option value="raw">PDF document</option></select></div><div class="field"><label for="folder">Folder</label><select name="folder" id="folder">{% for folder in ['branding','hero','projects','artisans','events','gallery','videos','documents','blog'] %}<option>{{ folder }}</option>{% endfor %}</select></div><div class="field"><label for="visibility">Visibility</label><select name="visibility" id="visibility"><option value="private">Private — authenticated download</option><option value="public">Public — CDN accessible</option></select></div>{% endif %}<button class="button" {{ 'disabled' if not configured }}>Upload securely</button></form></div>{% endblock %}
