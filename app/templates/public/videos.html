{% extends 'base.html' %}{% block content %}<section class="page-heading"><p class="eyebrow">IN MOTION</p><h1>Stories to <em>watch.</em></h1></section><section class="section card-grid">{% for asset in assets %}<article>{% if asset.secure_url|video_embed %}<iframe title="{{ asset.title }}" src="{{ asset.secure_url|video_embed }}" loading="lazy" allowfullscreen></iframe>{% else %}<video controls preload="none"><source src="{{ asset.secure_url }}"><p>Your browser cannot play this video.</p></video>{% endif %}<h2>{{ asset.title }}</h2></article>{% else %}<p class="empty">Video content will be updated by the organization.</p>{% endfor %}</section>{% endblock %}
